name: Release

# 发版工具：推送 v* 形式的 tag 后自动创建 GitHub Release。
# 版本号的确定与 tag 的创建仍在本地完成，本 workflow 只负责校验与发布。
# 由于 GitHub 执行 tag 触发的 workflow 时使用的是「被 tag 的那个提交里的」
# workflow 文件，因此本文件必须先合入默认分支，再打 tag。
#
# Release 说明直接取自 CHANGELOG.md 中对应版本的段落，与变更清单是同一份内容，
# 不需要维护两处。因此发版前必须先在 CHANGELOG.md 里写好该版本，否则本流程会失败。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在于远端的 tag 名 例如 v1.1.1
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi

          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::invalid tag '$TAG' (expected something like v1.1.1)"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 版本一致性防呆：tag 必须与 consts.Version 相同，避免再次出现
      # 「已发布 v1.1.0 而代码里仍写 1.0.0」的脱节。
      - name: Verify tag matches consts.Version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          EXPECTED="${TAG#v}"
          ACTUAL=$(grep -E '^[[:space:]]*Version[[:space:]]*=' consts/consts.go \
            | head -n 1 \
            | sed -E 's/.*"([^"]+)".*/\1/')

          echo "tag 期望版本: $EXPECTED"
          echo "consts.Version: $ACTUAL"

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::tag ${TAG} 与 consts.Version (${ACTUAL}) 不一致 请先同步版本号"
            exit 1
          fi

      # 发版说明取自 CHANGELOG.md 中对应版本的段落，保证「变更清单」与「Release 说明」
      # 是同一份内容，不需要维护两处。缺失或为空时直接失败，避免发出没有说明的版本。
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          NOTES=$(awk -v want="## [$VERSION]" '
            index($0, want) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)

          if ! printf '%s\n' "$NOTES" | grep -qE '^[[:space:]]*-[[:space:]]'; then
            echo "::error::CHANGELOG.md 中找不到 ${VERSION} 的变更条目 请先补好该版本的段落再打 tag"
            exit 1
          fi

          # 上一个版本同样从 CHANGELOG.md 推断：该版本段落之后遇到的第一个 ## 标题就是上一版本。
          # 这里不用 git describe，因为仓库历史里还挂着上游 Python 项目的 tag，容易被误选。
          PREV=$(awk -v want="## [$VERSION]" '
            index($0, want) == 1 { found = 1; next }
            found && /^## \[/ { print; exit }
          ' CHANGELOG.md | sed -E 's/^## \[([^]]+)\].*/v\1/')

          {
            printf '%s\n' "$NOTES"
            echo
            echo "---"
            echo "**完整变更清单**：[CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/master/CHANGELOG.md)"
            if [ -n "$PREV" ]; then
              echo "**Full Changelog**：https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            fi
          } > "$RUNNER_TEMP/release-notes.md"

          echo "Release 说明："
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # 幂等：重复触发或手动重跑时，已存在的 Release 直接跳过。
      - name: Detect existing release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG 已存在 跳过创建"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 说明使用上一步从 CHANGELOG.md 抽取的段落，而不是 GitHub 自动生成的提交列表，
      # 这样使用者在 Release 页与仓库里看到的是同一份变更说明。
      - name: Create release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
